name: EDP HA Bridge TEST

on:
  push:
    branches:
      - test/edp-ha-command-center-v1-consolidated
    paths:
      - "home-assistant/bridge/**"
      - ".github/workflows/edp-ha-bridge-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Bridge unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out TEST source
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run bridge harness
        run: node home-assistant/bridge/test/bridge_test.mjs

  deploy-test:
    name: Deploy existing Apps Script TEST web app
    needs: bridge-tests
    if: ${{ vars.ENABLE_APPS_SCRIPT_TEST_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: edp-ha-test
    steps:
      - name: Check out TEST source
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate deployment configuration
        env:
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          CLASP_TOKEN_JSON: ${{ secrets.CLASP_TOKEN_JSON }}
        run: |
          test -n "$APPS_SCRIPT_SCRIPT_ID"
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID"
          test -n "$CLASP_TOKEN_JSON"
      - name: Configure clasp authentication
        env:
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          CLASP_TOKEN_JSON: ${{ secrets.CLASP_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASP_TOKEN_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_SCRIPT_ID" > home-assistant/bridge/.clasp.json
      - name: Push version-controlled bridge files
        working-directory: home-assistant/bridge
        run: npx -y @google/clasp@3.4.1 push -f
      - name: Update the existing TEST deployment
        working-directory: home-assistant/bridge
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: >
          npx -y @google/clasp@3.4.1 create-deployment
          --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID"
          --description "EDP HA Bridge TEST ${GITHUB_SHA::7}"
