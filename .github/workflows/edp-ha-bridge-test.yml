name: EDP HA Bridge TEST

on:
  push:
    branches:
      - test/edp-ha-command-center-v1-consolidated
    paths:
      - "home-assistant/bridge/**"
      - ".github/workflows/edp-ha-bridge-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Bridge unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out TEST source
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run bridge harness
        run: node home-assistant/bridge/test/bridge_test.mjs
      - name: Upload verified bridge snapshot
        uses: actions/upload-artifact@v4
        with:
          name: edp-ha-bridge-test-${{ github.sha }}
          path: |
            home-assistant
            .github/workflows/edp-ha-bridge-test.yml
          if-no-files-found: error
          retention-days: 30

  deploy-test:
    name: Deploy existing Apps Script TEST web app
    needs: bridge-tests
    if: ${{ needs.bridge-tests.result == 'success' }}
    runs-on: ubuntu-latest
    environment: edp-ha-test
    steps:
      - name: Check out TEST source
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate deployment configuration
        env:
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          CLASP_TOKEN_JSON: ${{ secrets.CLASP_TOKEN_JSON }}
        run: |
          missing=0
          if [ -z "$APPS_SCRIPT_SCRIPT_ID" ]; then echo "Missing GitHub secret: APPS_SCRIPT_SCRIPT_ID"; missing=1; fi
          if [ -z "$APPS_SCRIPT_DEPLOYMENT_ID" ]; then echo "Missing GitHub secret: APPS_SCRIPT_DEPLOYMENT_ID"; missing=1; fi
          if [ -z "$CLASP_TOKEN_JSON" ]; then echo "Missing GitHub secret: CLASP_TOKEN_JSON"; missing=1; fi
          exit "$missing"
      - name: Configure clasp authentication
        env:
          APPS_SCRIPT_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
          CLASP_TOKEN_JSON: ${{ secrets.CLASP_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASP_TOKEN_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_SCRIPT_ID" > home-assistant/bridge/.clasp.json
      - name: Push version-controlled bridge files
        working-directory: home-assistant/bridge
        run: npx -y @google/clasp@3.4.1 push -f
      - name: Update the existing TEST deployment
        working-directory: home-assistant/bridge
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: >
          npx -y @google/clasp@3.4.1 create-deployment
          --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID"
          --description "EDP HA Bridge TEST ${GITHUB_SHA::7}"
      - name: Run deployed runtime smoke checks
        env:
          EDP_BRIDGE_BASE_URL: https://script.google.com/macros/s/AKfycby6eIy_gQfNZpG7BE0zVtrjWDNivnKe6t3qLhE9ihB5pT_roG0h2sKLGseV8z-M3U8X/exec
          BRIDGE_PUBLIC_TOKEN: ${{ secrets.BRIDGE_PUBLIC_TOKEN }}
        run: node home-assistant/bridge/test/runtime_smoke.mjs
