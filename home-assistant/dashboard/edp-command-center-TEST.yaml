  - title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    subview: true
    cards:
      - type: markdown
        title: Entity Discovery
        content: >-
          This view answers the questions the build could not. Read it once
          after deploying and report the values back.

          **todo entities** ({{ states.todo | list | count }}):
          {% for e in states.todo %}
          `{{ e.entity_id }}` — {{ e.name }} ({{ e.state }} items)
          {% endfor %}
          {% if states.todo | list | count == 0 %}none{% endif %}

          **lock** ({{ states.lock | list | count }}):
          {% for e in states.lock %}`{{ e.entity_id }}` {% else %}none{% endfor %}

          **camera** ({{ states.camera | list | count }}):
          {% for e in states.camera %}`{{ e.entity_id }}` {% else %}none{% endfor %}

          **alarm_control_panel** ({{ states.alarm_control_panel | list | count }}):
          {% for e in states.alarm_control_panel %}`{{ e.entity_id }}` {% else %}none{% endfor %}

          **person** ({{ states.person | list | count }}):
          {% for e in states.person %}`{{ e.entity_id }}` {% else %}none{% endfor %}

          **battery sensors**:
          {{ states.sensor
             | selectattr('attributes.device_class','defined')
             | selectattr('attributes.device_class','eq','battery')
             | list | count }}

          **binary_sensor total**: {{ states.binary_sensor | list | count }}
          (door {{ states.binary_sensor | selectattr('attributes.device_class','defined') | selectattr('attributes.device_class','eq','door') | list | count }},
          window {{ states.binary_sensor | selectattr('attributes.device_class','defined') | selectattr('attributes.device_class','eq','window') | list | count }},
          motion {{ states.binary_sensor | selectattr('attributes.device_class','defined') | selectattr('attributes.device_class','eq','motion') | list | count }})

      - type: markdown
        title: Bridge Health
        content: >-
          **State:** {{ states('sensor.edp_bridge_health') }}

          **Spreadsheet:** {{ state_attr('sensor.edp_bridge_health','spreadsheet') }}

          **Last refresh:** {{ state_attr('sensor.edp_bridge_health','generated_at') }}
          ({{ states('sensor.edp_bridge_age') }} min ago)

          {% set missing = state_attr('sensor.edp_bridge_health','missing_tabs') %}
          {% if missing and missing | count > 0 %}
          **Tabs NOT found:** `{{ missing | join('`, `') }}`
          {% else %}
          All configured tabs found.
          {% endif %}

          {% set tabs = state_attr('sensor.edp_bridge_health','tabs') %}
          {% if tabs %}
          | Tab | Status | Rows | Missing |
          |---|---|---|---|
          {% for k, v in tabs.items() %}
          | {{ k }} | {{ v.status }} | {{ v.rows }} | {{ v.missing }} |
          {% endfor %}
          {% endif %}

