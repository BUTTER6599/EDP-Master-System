# Bridge self-check. Reports which configured tabs are missing from the
# spreadsheet, which is the failure this build is most likely to hit:
# the tab names came from the brief, not from the live file.
- resource: !secret edp_bridge_base
  scan_interval: 900
  timeout: 30
  params:
    health: "1"
    key: !secret edp_bridge_key_private
  sensor:
    - name: "EDP Bridge Health"
      unique_id: edp_bridge_health
      icon: mdi:bridge
      value_template: >-
        {% if value_json.ok is not defined %}unknown
        {%- elif value_json.ok %}ok
        {%- else %}degraded{% endif %}
      json_attributes:
        - missing_tabs
        - tabs
        - generated_at
        - spreadsheet
        - ok
