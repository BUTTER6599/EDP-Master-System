# EDP Master Sheet -> Home Assistant REST sensors.
#
# Include from configuration.yaml:
#   rest: !include edp/rest_sensors.yaml
# (or paste the list under an existing top-level `rest:` key).
#
# Scope note: these poll with the PRIVATE token, because the Command Center
# runs on Taylor's devices. For a kiosk or shop-floor display, duplicate the
# block with edp_bridge_key_public and a different `name` - the bridge then
# withholds amounts, employee names, bill names and message bodies at the
# source, so the public display never receives them in the first place.
#
# Each sensor's state is a COUNT, never the row data. Home Assistant caps
# state strings at 255 characters; rows travel in attributes instead.
#
# Business sensors poll every 5 minutes; bridge health polls every 15.
# The bridge's 60s cache absorbs overlap. Monitor Apps Script execution
# usage after TEST deployment rather than assuming a quota margin.

- resource: !secret edp_bridge_base
  scan_interval: 300
  timeout: 30
  params:
    tab: TASKS
    key: !secret edp_bridge_key_private
  sensor:
    - name: "EDP Tasks Open"
      unique_id: edp_tasks_open
      icon: mdi:clipboard-check-outline
      value_template: >-
        {{ value_json.count if value_json.ok | default(false) else 'unknown' }}
      json_attributes:
        - rows
        - generated_at
        - status
        - ok
        - truncated
        - error

