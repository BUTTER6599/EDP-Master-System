<script>
/* ==========================================================================
   Scripts.html — EDP OS Register client behavior (TEST shell, pass 1)

   SAFETY CONTRACT FOR THIS FILE:
     - No fetch/XHR/WebSocket. No external requests of any kind.
     - Printing is a hand-off to the browser's own print pipeline
       (window.print). This file never addresses a printer and holds no
       printer address, certificate or credential.
     - The only server calls are google.script.run to READ-ONLY functions.
     - Every "action" below mutates local page state only.
   ========================================================================== */
(function () {
  'use strict';

  var BOOT = window.EDP_BOOT || {};
  var CFG = BOOT.config || {};

  /* ---------------------------------------------------------------------- */
  /* State (page-local only — nothing persists anywhere)                     */
  /* ---------------------------------------------------------------------- */
  var state = {
    view: 'register',
    search: '',
    category: 'ALL',
    custSearch: '',
    inventory: BOOT.inventory || [],
    customers: BOOT.customers || [],
    activity: BOOT.activity || [],
    cart: [],                 // { itemId, qty, unitPrice, listPrice, warrantyId }
    customerId: null,
    paymentMethodId: 'CASH',
    ticketId: 'TXN-MOCK-0000',
    conn: {
      online: true,
      queue: 0,
      sync: 'SYNCED',         // SYNCED | SYNCING | PENDING
      printer: 'READY'        // READY | UNAVAILABLE
    }
  };

  /* ---------------------------------------------------------------------- */
  /* Small helpers                                                          */
  /* ---------------------------------------------------------------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* A missing figure renders as an em dash, never as $0.00. A total that
     could not be computed must look uncomputed — $0.00 reads like a real
     number and is how a wrong figure reaches a receipt. */
  function money(n) {
    if (typeof n !== 'number' || !isFinite(n)) { return '—'; }
    return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString(CFG.locale || 'en-US', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
  }

  function icon(id, style) {
    return '<svg viewBox="0 0 24 24"' + (style ? ' style="' + style + '"' : '') +
           '><use href="#' + id + '"></use></svg>';
  }

  function hashOf(str) {
    var h = 0;
    for (var i = 0; i < String(str).length; i++) { h = (h * 31 + String(str).charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  /* Single resolution point for every cart line.
     Returns the real inventory item, or NULL when the line cannot be resolved.
     Callers MUST handle null. The previous idiom, findItem(...) || {}, turned a
     missing item into a blank, zero-priced line — which is how an $818.69
     phantom sale reached the screen after the real-inventory cutover. */
  function resolveCartLine(line) {
    if (!line || !line.itemId) { return null; }
    return findItem(line.itemId);
  }

  function findItem(itemId) {
    for (var i = 0; i < state.inventory.length; i++) {
      if (state.inventory[i].itemId === itemId) { return state.inventory[i]; }
    }
    return null;
  }

  function findCustomer(id) {
    for (var i = 0; i < state.customers.length; i++) {
      if (state.customers[i].customerId === id) { return state.customers[i]; }
    }
    return null;
  }

  function warrantyById(id) {
    var list = CFG.warrantyOptions || [];
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) { return list[i]; } }
    return list[0] || { id: 'W-ASIS', label: 'As-Is / No Warranty', price: 0 };
  }

  /* ---------------------------------------------------------------------- */
  /* Product imagery                                                         */
  /*                                                                         */
  /* Real appliance photos are used when one is available; photoUri() below  */
  /* stays as the FALLBACK, used when a record has no usable photo or when   */
  /* the real image fails to load.                                           */
  /*                                                                         */
  /* EDP_MASTER_DATABASE stores two URL shapes in photo_links:               */
  /*   https://lh3.googleusercontent.com/d/<id>[=w2000]  direct image        */
  /*   https://drive.google.com/file/d/<id>/view?...     viewer PAGE         */
  /* Only the first renders inside an <img>. The second is a web page and    */
  /* would show a broken image, so it is normalised to the direct form.      */
  /* Anything that is not one of these two shapes is refused outright: the   */
  /* Register never points an <img> at an unrecognised host.                 */
  /* ---------------------------------------------------------------------- */
  var PHOTO_HOST = 'lh3.googleusercontent.com';

  function directPhotoUrl(u) {
    var s = String(u == null ? '' : u).trim();
    if (s.indexOf('https://') !== 0) { return ''; }
    var viewer = s.match(/^https:\/\/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)\//);
    if (viewer) { return 'https://' + PHOTO_HOST + '/d/' + viewer[1]; }
    if (new RegExp('^https://' + PHOTO_HOST + '/d/[A-Za-z0-9_-]+').test(s)) { return s; }
    return '';
  }

  /* First USABLE photo for a record. Scans the whole gallery rather than
     trusting photoPrimary, because a record's first photo can be a viewer
     page while a later one is already direct. Returns '' when none is usable. */
  function realPhotoFor(item) {
    var gallery = (item && item.photoGallery) || [];
    for (var i = 0; i < gallery.length; i++) {
      var direct = directPhotoUrl(gallery[i]);
      if (direct) { return direct; }
    }
    return directPhotoUrl(item && item.photoPrimary);
  }

  /* Swaps a failed real photo back to the drawn placeholder and reveals the
     "Photo placeholder" label. Guarded so a failing fallback cannot loop. */
  function photoFallback(img) {
    if (!img || img.getAttribute('data-fellback') === '1') { return; }
    img.setAttribute('data-fellback', '1');
    var it = findItem(img.getAttribute('data-item')) || {};
    img.src = photoUri(it, Number(img.getAttribute('data-w')) || 400,
                           Number(img.getAttribute('data-h')) || 300);
    var ph = img.parentNode ? img.parentNode.querySelector('.ph') : null;
    if (ph) { ph.hidden = false; }
  }
  window.edpPhotoFallback = photoFallback;

  var HUE = {
    refrigerator: 208, washer: 192, dryer: 264, range: 18,
    dishwasher: 162, freezer: 200, microwave: 34, television: 238
  };

  var SHAPES = {
    refrigerator:
      '<rect x="140" y="46" width="120" height="208" rx="12"/>' +
      '<path d="M140 132 H260"/>' +
      '<path d="M246 96 V118" stroke-width="6"/><path d="M246 152 V196" stroke-width="6"/>',
    freezer:
      '<rect x="146" y="42" width="108" height="216" rx="12"/>' +
      '<path d="M240 110 V190" stroke-width="6"/>' +
      '<path d="M146 96 H254" opacity=".45"/><path d="M146 150 H254" opacity=".45"/><path d="M146 204 H254" opacity=".45"/>',
    washer:
      '<rect x="126" y="58" width="148" height="184" rx="14"/>' +
      '<path d="M126 100 H274"/>' +
      '<circle cx="200" cy="176" r="44"/><circle cx="200" cy="176" r="30" opacity=".5"/>' +
      '<circle cx="152" cy="79" r="6"/><circle cx="172" cy="79" r="6"/>',
    dryer:
      '<rect x="126" y="58" width="148" height="184" rx="14"/>' +
      '<path d="M126 100 H274"/>' +
      '<circle cx="200" cy="176" r="46"/>' +
      '<path d="M172 176 H228 M200 148 V204" opacity=".5"/>' +
      '<circle cx="250" cy="79" r="8"/>',
    range:
      '<rect x="122" y="86" width="156" height="168" rx="10"/>' +
      '<path d="M122 128 H278"/>' +
      '<rect x="146" y="150" width="108" height="86" rx="8" opacity=".55"/>' +
      '<circle cx="160" cy="66" r="17"/><circle cx="240" cy="66" r="17"/>' +
      '<path d="M122 86 H278" stroke-width="5"/>',
    dishwasher:
      '<rect x="128" y="62" width="144" height="180" rx="10"/>' +
      '<path d="M128 96 H272"/>' +
      '<path d="M152 118 H248" stroke-width="7"/>' +
      '<circle cx="156" cy="79" r="5"/><circle cx="174" cy="79" r="5"/><circle cx="192" cy="79" r="5"/>' +
      '<rect x="152" y="146" width="96" height="70" rx="6" opacity=".4"/>',
    microwave:
      '<rect x="96" y="104" width="208" height="104" rx="10"/>' +
      '<rect x="112" y="120" width="130" height="72" rx="6" opacity=".55"/>' +
      '<path d="M258 124 V188" stroke-width="5" opacity=".8"/>' +
      '<circle cx="280" cy="136" r="7"/><circle cx="280" cy="160" r="7"/>',
    television:
      '<rect x="76" y="72" width="248" height="140" rx="8"/>' +
      '<rect x="90" y="86" width="220" height="112" rx="4" opacity=".5"/>' +
      '<path d="M200 212 V238 M158 244 H242" stroke-width="7"/>'
  };

  /**
   * Returns a data: URI for a locally drawn placeholder image.
   * No network involved.
   */
  function photoUri(item, w, h) {
    var key = String(item.photoKey || 'box').toLowerCase();
    var hue = HUE[key] == null ? 214 : HUE[key];
    var shape = SHAPES[key] || SHAPES.refrigerator;
    var seed = hashOf(item.itemId);
    var tilt = 20 + (seed % 40);          // slight per-item gradient variation
    var light = 92 - (seed % 6);

    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="' + (w || 400) + '" height="' + (h || 300) + '">' +
        '<defs>' +
          '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(' + tilt + ' .5 .5)">' +
            '<stop offset="0" stop-color="hsl(' + hue + ',34%,' + light + '%)"/>' +
            '<stop offset="1" stop-color="hsl(' + (hue + 14) + ',30%,' + (light - 14) + '%)"/>' +
          '</linearGradient>' +
        '</defs>' +
        '<rect width="400" height="300" fill="url(#g)"/>' +
        '<ellipse cx="200" cy="262" rx="104" ry="15" fill="hsl(' + hue + ',26%,' + (light - 22) + '%)" opacity=".55"/>' +
        '<g fill="none" stroke="hsl(' + hue + ',30%,30%)" stroke-width="9" ' +
           'stroke-linecap="round" stroke-linejoin="round" opacity=".85">' + shape + '</g>' +
      '</svg>';

    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  /* ---------------------------------------------------------------------- */
  /* 7. Live clock — America/Chicago, time first then full date             */
  /* ---------------------------------------------------------------------- */
  var timeFmt, dateFmt;
  try {
    timeFmt = new Intl.DateTimeFormat('en-US', {
      timeZone: CFG.timezone || 'America/Chicago',
      hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
    });
    dateFmt = new Intl.DateTimeFormat('en-US', {
      timeZone: CFG.timezone || 'America/Chicago',
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
  } catch (e) {
    timeFmt = null; dateFmt = null;
  }

  function tickClock() {
    var now = new Date();
    var timeEl = $('#clockTime');
    var dateEl = $('#clockDate');
    if (!timeEl || !dateEl) { return; }

    if (timeFmt && dateFmt) {
      // Split the meridiem out so it can be styled smaller.
      var t = timeFmt.format(now);                       // e.g. "3:07:22 PM"
      var m = t.match(/^(.*?)\s*([AP]M)$/i);
      var clock = m ? m[1] : t;
      var mer = m ? m[2].toUpperCase() : '';
      timeEl.innerHTML = esc(clock) + '<span class="mer">' + esc(mer) + '</span>';
      dateEl.textContent = dateFmt.format(now);          // "Sunday, August 30, 2026"
    } else {
      timeEl.textContent = now.toLocaleTimeString();
      dateEl.textContent = now.toDateString();
    }
  }

  /* ---------------------------------------------------------------------- */
  /* 1. Register / POS home                                                  */
  /* ---------------------------------------------------------------------- */
  var AVAIL = {
    AVAILABLE: { label: 'Available', cls: 'is-ok',     sellable: true,  bg: 'rgba(230,245,239,.94)', fg: '#12805c' },
    LOW_STOCK: { label: 'Low stock', cls: 'is-warn',   sellable: true,  bg: 'rgba(253,243,227,.94)', fg: '#b45309' },
    ON_HOLD:   { label: 'On hold',   cls: 'is-warn',   sellable: false, bg: 'rgba(253,243,227,.94)', fg: '#b45309' },
    SOLD:      { label: 'Sold',      cls: 'is-danger', sellable: false, bg: 'rgba(253,236,235,.94)', fg: '#b42318' }
  };
  function availMeta(code) { return AVAIL[code] || AVAIL.AVAILABLE; }

  function renderCategories() {
    var wrap = $('#catFilters');
    if (!wrap) { return; }
    var cats = ['ALL'].concat(BOOT.categories || []);
    wrap.innerHTML = cats.map(function (c) {
      return '<button type="button" data-cat="' + esc(c) + '"' +
             (state.category === c ? ' class="active"' : '') + '>' +
             esc(c === 'ALL' ? 'All items' : c) + '</button>';
    }).join('');
  }

  function filteredInventory() {
    var q = state.search.trim().toLowerCase();
    return state.inventory.filter(function (it) {
      if (state.category !== 'ALL' && it.category !== state.category) { return false; }
      if (!q) { return true; }
      return [it.itemId, it.brand, it.model, it.category, it.description, it.condition]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderGrid() {
    var grid = $('#prodGrid');
    var empty = $('#prodEmpty');
    if (!grid) { return; }

    var items = filteredInventory();
    empty.hidden = items.length > 0;

    grid.innerHTML = items.map(function (it) {
      var a = availMeta(it.availability);
      var real = realPhotoFor(it);
      var inCart = state.cart.some(function (l) { return l.itemId === it.itemId; });
      return '' +
        '<article class="prod" data-sellable="' + a.sellable + '">' +
          '<div class="photo">' +
            '<img src="' + (real ? esc(real) : photoUri(it, 400, 300)) + '"' +
              ' alt="' + esc(it.brand + ' ' + it.model) + '" loading="lazy"' +
              (real ? ' data-item="' + esc(it.itemId) + '" data-w="400" data-h="300"' +
                      ' onerror="edpPhotoFallback(this)"' : '') + '>' +
            '<span class="avail" style="background:' + a.bg + ';color:' + a.fg + '">' + esc(a.label) + '</span>' +
            '<span class="ph"' + (real ? ' hidden' : '') + '>Photo placeholder</span>' +
          '</div>' +
          '<div class="info">' +
            '<div class="cat">' + esc(it.category) + '</div>' +
            '<div class="title">' + esc(it.brand + ' ' + it.model) + '</div>' +
            '<div class="desc">' + esc(it.description) + '</div>' +
            '<div class="idline">' + esc(it.itemId) +
              (it.location ? ' · ' + esc(it.location) : '') + '</div>' +
            '<div class="foot">' +
              '<span class="price">' + money(it.price) + '</span>' +
              '<span class="cond">' + esc(it.condition) + '<br>Qty ' + esc(it.qty) + '</span>' +
            '</div>' +
          '</div>' +
          '<button class="add" type="button" data-add="' + esc(it.itemId) + '"' +
            (a.sellable ? '' : ' disabled') + '>' +
            (a.sellable ? (inCart ? 'In cart · Add another' : 'Add to sale') : esc(a.label)) +
          '</button>' +
        '</article>';
    }).join('');

    renderStockSummary(items.length);
  }

  /* The label reflects the ACTIVE data source rather than asserting "mock".
     It starts neutral and is sharpened once getDataSourceInfo() answers; if
     that read-only call is unavailable or fails, the neutral wording stands. */
  var dataSourceLabel = 'items';
  var lastShownCount = 0;

  function renderStockSummary(shown) {
    if (typeof shown === 'number') { lastShownCount = shown; }
    var summary = $('#stockSummary');
    if (!summary) { return; }
    summary.textContent = lastShownCount + ' of ' + state.inventory.length + ' ' +
      dataSourceLabel + ' shown · tap a card to add it to the sale';
  }

  function loadDataSourceLabel() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) { return; }
    google.script.run
      .withSuccessHandler(function (info) {
        if (!info || !info.id) { return; }
        dataSourceLabel = info.isMock ? 'mock items' : 'live inventory items';
        renderStockSummary();
      })
      .withFailureHandler(function () { /* neutral wording stands */ })
      .getDataSourceInfo();
  }

  /* ---------------------------------------------------------------------- */
  /* 1b. Checkout plumbing (Package 13)                                      */
  /*                                                                         */
  /* None of this completes a sale. Completing a sale is disabled, there is  */
  /* no SALES writer, and the OAuth scope is read-only. What lives here is   */
  /* the part that has to be right BEFORE any of that is switched on: a      */
  /* stable request identity, a guard against a double tap, and an error     */
  /* the operator can actually see.                                          */
  /* ---------------------------------------------------------------------- */

  /* The identity of one checkout ATTEMPT, not of one button press.

     It is minted once when a checkout begins and reused for every retry of
     that same attempt, which is what lets the server recognise a repeat and
     return the original sale instead of ringing a second one. A new id is
     minted only when the cart changes or the attempt is abandoned.

     crypto.randomUUID is used when the browser has it. The fallback is not
     a security token and does not need to be unguessable — it needs to be
     unique across the tills in one shop, which time plus randomness gives. */
  function newRequestId() {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return 'REQ-' + window.crypto.randomUUID();
      }
    } catch (e) { /* fall through */ }
    var r = '';
    for (var i = 0; i < 4; i++) { r += Math.random().toString(36).slice(2, 10); }
    return 'REQ-' + Date.now().toString(36) + '-' + r.slice(0, 24);
  }

  /* The live checkout attempt. null means no attempt is in progress. */
  state.checkout = { requestId: null, inFlight: false };

  function beginCheckoutAttempt() {
    if (!state.checkout.requestId) { state.checkout.requestId = newRequestId(); }
    return state.checkout.requestId;
  }

  /* Abandoning an attempt forgets its id, so the NEXT checkout is a new sale
     rather than a retry of the old one. Any change to the cart abandons the
     attempt: a retry must mean the same cart, or idempotency would happily
     return a sale for goods the customer did not buy. */
  function abandonCheckoutAttempt() {
    state.checkout.requestId = null;
    state.checkout.inFlight = false;
  }

  /* Double-submit guard.

     Disabling the button is not enough on its own: a double tap can land two
     events before the first handler runs, and a disabled attribute set inside
     the first handler is already too late for the second. The boolean is
     checked FIRST and set synchronously, so the second call returns having
     done nothing at all.

     done() is handed to the caller rather than inferred, because an async
     server round trip finishes at a time only the caller knows. */
  function withSubmitLock(btn, run) {
    if (state.checkout.inFlight) { return false; }
    state.checkout.inFlight = true;
    if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    var released = false;
    function done() {
      if (released) { return; }          // releasing twice must not unlock a
      released = true;                   // lock a later attempt is holding
      state.checkout.inFlight = false;
      if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); }
    }
    try {
      run(done);
    } catch (e) {
      done();                            // a throw must never strand the lock
      throw e;
    }
    return true;
  }

  /* A failure the operator can see.

     Before Package 13 both withFailureHandler callbacks were silent — one had
     an empty body. A till that swallows errors teaches its operator to trust
     a screen that is lying to them, so every server failure now lands in the
     Activity timeline with its code. */
  function logServerError(action, code, message) {
    logLocalEvent('SERVER_ERROR', action, {
      detail: String(message || 'No detail was returned.'),
      status: 'FAILED',
      reason: String(code || 'UNKNOWN')
    });
  }

  /* ---------------------------------------------------------------------- */
  /* 2. Cart / checkout                                                      */
  /* ---------------------------------------------------------------------- */
  /* APPROVED EDP RETAIL TAX POLICY (owner decision, 2026-10-03; closes NV-1).
     Prices are TAX-INCLUSIVE: the price shown IS what the customer pays, and
     tax is extracted from that total rather than added to it.

     The Register holds NO rate of its own — the rate, the mode and the label
     all come from Config.gs, which carries the authority for them. That is
     deliberate: one rate, one place, one thing to change if a parish rate
     moves. */

  /* Fail closed on tax configuration. The previous idiom, CFG.taxRate || 0,
     turned a missing rate into a silent 0% — a receipt that reads $0.00 tax
     and looks entirely normal. A rate that is not configured must produce no
     tax figure and no total at all. */
  function taxConfigError() {
    if (CFG.taxMode !== 'INCLUSIVE') { return 'TAX MODE NOT CONFIGURED'; }
    var r = CFG.taxRate;
    if (typeof r !== 'number' || !isFinite(r) || r <= 0 || r >= 1) {
      return 'TAX RATE NOT CONFIGURED';
    }
    return null;
  }

  /* Splits a tax-inclusive total into its tax and pre-tax parts.

       tax     = total - (total / (1 + rate))
       pre-tax = total - tax

     Done in whole cents so the two rounded parts always reconstruct the total
     exactly: the tax is rounded once, and the pre-tax amount is whatever is
     left. Deriving both independently would let them disagree with the total
     by a cent, which on a tax document is a defect. */
  function splitInclusiveTax(total, rate) {
    var totalCents = Math.round(total * 100);
    var taxCents = Math.round(totalCents - totalCents / (1 + rate));
    return { tax: taxCents / 100, preTax: (totalCents - taxCents) / 100 };
  }

  /* One label for every surface, so the cart, the screen receipt and the
     printed slip can never describe the same tax differently. */
  function taxLineLabel() {
    if (CFG.taxLabel) { return CFG.taxLabel; }
    var err = taxConfigError();
    if (err) { return err; }
    return 'Sales Tax (' + (CFG.taxRate * 100).toFixed(2) + '%, included)';
  }

  /* Any change to the cart ends the current checkout attempt. A retry has to
     mean the same goods, or an idempotent server would return a sale for a
     cart that no longer exists. */
  function cartChanged() { abandonCheckoutAttempt(); }

  function cartTotals() {
    var sub = 0, warr = 0, count = 0, unresolved = 0;
    state.cart.forEach(function (l) {
      // An unresolved line contributes NOTHING: no subtotal, no warranty, no
      // tax, no item count, no total. It cannot move money.
      if (!resolveCartLine(l)) { unresolved += 1; return; }
      sub += l.unitPrice * l.qty;
      warr += warrantyById(l.warrantyId).price * l.qty;
      count += l.qty;
    });

    /* THE CUSTOMER TOTAL. Tax-inclusive, so it is exactly the sum of the
       prices on display. Nothing is added to it — this line is the whole
       policy. */
    var total = Math.round((sub + warr) * 100) / 100;

    var err = taxConfigError();
    if (err) {
      return { sub: sub, warr: warr, tax: null, preTax: null, total: null,
               count: count, unresolved: unresolved, taxError: err };
    }
    var split = splitInclusiveTax(total, CFG.taxRate);
    return { sub: sub, warr: warr, tax: split.tax, preTax: split.preTax,
             total: total, count: count, unresolved: unresolved, taxError: null };
  }

  function renderCart() {
    var wrap = $('#cartLines');
    if (!wrap) { return; }

    if (!state.cart.length) {
      wrap.innerHTML = '<div class="empty"><div class="big">No items yet</div>' +
        '<div>Add an appliance from the Register tab.</div></div>';
    } else {
      var opts = CFG.warrantyOptions || [];
      wrap.innerHTML = state.cart.map(function (l, idx) {
        var it = resolveCartLine(l);
        if (!it) {
          // Fail closed and VISIBLY. Never a blank name with a silent price.
          return '' +
            '<div class="line">' +
              '<div class="mid">' +
                '<div class="nm">UNRESOLVED ITEM — not included in totals</div>' +
                '<div class="meta">' + esc(l.itemId) + ' · not found in the active inventory</div>' +
              '</div>' +
              '<div class="rt">' +
                '<button class="rm" type="button" data-rm="' + idx + '">Remove</button>' +
              '</div>' +
            '</div>';
        }
        var changed = l.listPrice != null && l.unitPrice !== l.listPrice;
        var thumb = realPhotoFor(it);
        return '' +
          '<div class="line">' +
            '<div class="thumb"><img src="' + (thumb ? esc(thumb) : photoUri(it, 120, 120)) + '"' +
              (thumb ? ' data-item="' + esc(it.itemId) + '" data-w="120" data-h="120"' +
                       ' onerror="edpPhotoFallback(this)"' : '') + ' alt=""></div>' +
            '<div class="mid">' +
              '<div class="nm">' + esc((it.brand || '') + ' ' + (it.model || '')) + '</div>' +
              '<div class="meta">' + esc(l.itemId) + ' · qty ' + l.qty + '</div>' +
              '<select class="warr" data-warr="' + idx + '" aria-label="Warranty for ' + esc(l.itemId) + '">' +
                opts.map(function (w) {
                  return '<option value="' + esc(w.id) + '"' + (w.id === l.warrantyId ? ' selected' : '') + '>' +
                    esc(w.label) + (w.price ? ' (+' + money(w.price) + ')' : '') + '</option>';
                }).join('') +
              '</select>' +
            '</div>' +
            '<div class="rt">' +
              (changed ? '<span class="was">' + money(l.listPrice) + '</span>' : '') +
              '<span class="amt">' + money(l.unitPrice * l.qty) + '</span>' +
              '<button class="rm" type="button" data-rm="' + idx + '">Remove</button>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    var t = cartTotals();
    $('#subLabel').textContent = 'Subtotal (' + t.count + (t.count === 1 ? ' item)' : ' items)');
    $('#subTotal').textContent = money(t.sub);
    $('#warrTotal').textContent = money(t.warr);
    $('#taxLabel').textContent = taxLineLabel();
    $('#taxTotal').textContent = money(t.tax);
    $('#grandTotal').textContent = money(t.total);
    $('#cartFabCount').textContent = String(t.count);

    // The Complete Sale button stays disabled for the whole of pass 1.
    var btn = $('#btnCompleteSale');
    btn.disabled = true;
    btn.setAttribute('aria-disabled', 'true');
  }

  function renderCartCustomer() {
    var c = findCustomer(state.customerId);
    $('#cartCustAv').textContent = c ? initials(c.name) : '—';
    $('#cartCustName').textContent = c ? c.name : 'Walk-in customer';
    $('#cartCustPhone').textContent = c ? (c.phone + ' · ' + c.customerId) : 'No customer linked';
    $('#cartCustChange').textContent = c ? 'Change' : 'Link';
  }

  function renderPayments() {
    var grid = $('#payGrid');
    if (!grid) { return; }
    grid.innerHTML = (CFG.paymentMethods || []).map(function (p) {
      return '<button type="button" data-pay="' + esc(p.id) + '"' +
             (state.paymentMethodId === p.id ? ' class="active"' : '') + '>' +
             esc(p.label) + '</button>';
    }).join('');
  }

  function addToCart(itemId) {
    var it = findItem(itemId);
    if (!it || !availMeta(it.availability).sellable) { return; }

    var existing = null;
    state.cart.forEach(function (l) { if (l.itemId === itemId) { existing = l; } });
    if (existing) {
      existing.qty += 1;
    } else {
      state.cart.push({
        itemId: itemId, qty: 1,
        unitPrice: it.price, listPrice: it.price,
        warrantyId: 'W-30'
      });
    }

    logLocalEvent('ITEM_ADDED', 'Item added to cart',
      { detail: it.itemId + ' — ' + it.brand + ' ' + it.model + ' @ ' + money(it.price), status: 'OK' });

    cartChanged();
    renderCart(); renderGrid(); renderReceipt();
  }

  /* ---------------------------------------------------------------------- */
  /* 3. Customer                                                             */

  function renderCustomerList() {

    if (!list) { return; }

    var rows = state.customers.filter(function (c) {
      if (!q) { return true; }
      return (c.name + ' ' + c.phone + ' ' + c.customerId).toLowerCase().indexOf(q) !== -1;
    });

    if (!rows.length) {
      list.innerHTML = '<div class="empty"><div class="big">No matching customers</div>' +
        '<div>Mock directory holds ' + state.customers.length + ' demo records.</div></div>';

    }

    list.innerHTML = rows.map(function (c) {
      return '<button class="custrow' + (c.customerId === state.customerId ? ' active' : '') +
             '" type="button" data-cust="' + esc(c.customerId) + '">' +
        '<span class="av">' + esc(initials(c.name)) + '</span>' +
        '<span><span class="nm">' + esc(c.name) + '</span><br>' +
          '<span class="ph">' + esc(c.phone) + '</span></span>' +
        '<span class="rt">' + esc(c.customerId) + '<br>' + c.history.length + ' purchase' +
          (c.history.length === 1 ? '' : 's') + '</span>' +

  function phBlock(title, sub) {
    return '<div class="ph-block"><div class="t">' + esc(title) + '</div>' + esc(sub) + '</div>';
  }

  function linkCustomer(id) {
    var before = state.customerId ? (findCustomer(state.customerId) || {}).name : 'Walk-in (unassigned)';
    state.customerId = id;
    var c = findCustomer(id);
    logLocalEvent('CUSTOMER_LINKED', 'Customer linked',
      { before: before, after: c ? (c.name + ' — ' + c.customerId) : 'Walk-in', status: 'OK' });
    renderCustomerList(); renderCustomerDetail(); renderCartCustomer(); renderReceipt();

  /* ---------------------------------------------------------------------- */
  /* 4. Receipt — ONE data model, many channels                             */
  /*                                                                        */
  /* buildReceiptModel() is the single source of truth for what a receipt    */
  /* contains. Every present and future channel consumes THIS and nothing    */
  /* else, so the phone, a tablet and a desktop can never drift apart:       */
  /*                                                                        */
  /*   on-screen preview   renderReceipt()                                  */
  /*   thermal print       the same DOM, handed to the OS print service      */
  /*   reprint             not built yet                                    */
  /*   email receipt       not built yet                                    */
  /*   text receipt        not built yet                                    */
  /*   ePOS-Print XML      buildEposPrintXml() — built, deliberately unused  */
  /*                                                                        */
  /* FIELD POLICY: the builder copies an explicit ALLOWLIST out of each      */
  /* inventory record. It never spreads the record. The private columns     */
  /* named in FORBIDDEN_CLIENT_FIELDS (DataSource.gs) are already stripped   */
  /* server-side; this allowlist is a second, independent barrier, so a      */
  /* future server-side change cannot put a private column onto a printed    */
  /* receipt by accident.                                                    */
  /*                                                                        */
  /* UNRESOLVED LINES: kept in cart order with resolved:false, carrying no   */
  /* money. Package 10's rule holds on every channel — an unresolvable line  */
  /* is shown, never silently dropped and never silently priced.            */
  /* ---------------------------------------------------------------------- */
  var TEST_RECEIPT_MARK = 'TEST — NOT A SALE';
  var TEST_RECEIPT_WHY  = 'No sale was recorded. No payment was taken. No inventory changed.';

  /* A receipt is a TEST receipt unless completing a sale is genuinely
     enabled. The mark is therefore driven by the feature flag, not by a
     separate switch someone could forget to flip back. */
  function isTestReceipt() {
    var f = CFG.features || {};
    return f.COMPLETE_SALE_ENABLED !== true;
  }

  function buildReceiptModel() {
    var c  = findCustomer(state.customerId);
    var t  = cartTotals();
    var pm = (CFG.paymentMethods || []).filter(function (p) { return p.id === state.paymentMethodId; })[0];
    var now = new Date();

    var lines = state.cart.map(function (l) {
      var it = resolveCartLine(l);
      if (!it) { return { resolved: false, itemId: String(l && l.itemId || '') }; }
      var w = warrantyById(l.warrantyId);
      return {
        resolved: true,
        itemId: it.itemId,
        brand: it.brand || '',
        model: it.model || '',
        description: it.description || '',
        condition: it.condition || '',
        serialPlaceholder: it.serialPlaceholder || '[ SERIAL PLACEHOLDER ]',
        qty: l.qty,
        unitPrice: l.unitPrice,
        listPrice: l.listPrice,
        lineTotal: l.unitPrice * l.qty,
        warrantyId: w.id,
        warrantyLabel: w.label,
        warrantyPrice: w.price,
        photoUrl: realPhotoFor(it) || ''
      };
    });

    return {
      isTest: isTestReceipt(),
      testMark: TEST_RECEIPT_MARK,
      testWhy: TEST_RECEIPT_WHY,
      store: {
        short: CFG.companyShort || 'Electronics Depot',
        company: CFG.companyName || '',
        address: CFG.storeAddress || '',
        phone: CFG.storePhone || '',
        footer: CFG.storeFooter || ''
      },
      ticketId: state.ticketId,
      dateIso: now.toISOString(),
      dateText: dateFmt ? dateFmt.format(now) : now.toISOString(),
      customer: c ? { name: c.name, phone: c.phone, customerId: c.customerId } : null,
      payment: { id: pm ? pm.id : 'CASH', label: pm ? pm.label : 'Cash' },
      lines: lines,
      totals: {
        sub: t.sub, warranty: t.warr, total: t.total,
        /* tax and preTax are BOTH contained in total — they are a breakdown
           of it, not additions to it. preTax + tax === total, exactly. */
        tax: t.tax, preTax: t.preTax,
        itemCount: t.count, unresolvedCount: t.unresolved,
        taxLabel: taxLineLabel(),
        taxMode: CFG.taxMode || null,
        taxRate: typeof CFG.taxRate === 'number' ? CFG.taxRate : null,
        taxError: t.taxError
      },
      build: {
        environment: CFG.environment || 'TEST',
        version: CFG.buildVersion || ''
      }
    };
  }

  /* The TEST mark. Rendered at the TOP and at the BOTTOM of the receipt so a
     piece of paper torn anywhere still says what it is. */
  function testMarkHtml(m, where) {
    if (!m.isTest) { return ''; }
    return '<div class="rtestmark' + (where === 'bottom' ? ' bottom' : '') + '">' +
      esc(m.testMark) + '<span class="why">' + esc(m.testWhy) + '</span></div>';
  }

  function receiptLineHtml(l, px) {
    if (!l.resolved) {
      return '<div class="ritem unresolved">' +
        '<div class="mid">' +
          '<div class="nm">UNRESOLVED ITEM — not included in totals</div>' +
          '<div class="sm">ITEM ID: ' + esc(l.itemId) + '</div>' +
        '</div>' +
      '</div>';
    }
    return '<div class="ritem">' +
      '<div class="thumb"><img src="' + (l.photoUrl ? esc(l.photoUrl) : px(l.itemId)) + '"' +
        (l.photoUrl ? ' data-item="' + esc(l.itemId) + '" data-w="160" data-h="160"' +
                      ' onerror="edpPhotoFallback(this)"' : '') + ' alt=""></div>' +
      '<div class="mid">' +
        '<div class="nm">' + esc((l.brand + ' ' + l.model).trim()) + '</div>' +
        '<div class="sm">' +
          'ITEM ID: ' + esc(l.itemId) + '<br>' +
          'BRAND: ' + esc(l.brand || '—') + ' · MODEL: ' + esc(l.model || '—') + '<br>' +
          'SERIAL: ' + esc(l.serialPlaceholder) + '<br>' +
          'CONDITION: ' + esc(l.condition || '—') +
        '</div>' +
        '<span class="warr">' + esc(l.warrantyLabel) +
          (l.warrantyPrice ? ' · +' + money(l.warrantyPrice) : '') + '</span>' +
      '</div>' +
      '<div class="amt">' + money(l.lineTotal) + '</div>' +
    '</div>';
  }

  function renderReceipt() {
    var el = $('#receipt');
    if (!el) { return; }
    var m = buildReceiptModel();

    /* photoUri() needs the record, not the model, so resolve it here rather
       than carrying a data: URI through the shared model. */
    function px(itemId) {
      var it = findItem(itemId);
      return it ? photoUri(it, 160, 160) : '';
    }

    var lines = m.lines.length
      ? m.lines.map(function (l) { return receiptLineHtml(l, px); }).join('')
      : '<div class="empty" style="padding:28px 0"><div class="big">No line items</div>' +
        '<div>Add an item on the Register tab to populate this preview.</div></div>';

    el.innerHTML =
      testMarkHtml(m, 'top') +

      '<div class="rhead">' +
        '<div class="mark">EDP</div>' +
        '<h3>' + esc(m.store.short) + '</h3>' +
        '<div class="co">' + esc(m.store.company) + '</div>' +
        '<div class="ph">' + esc(m.store.address) + '<br>' + esc(m.store.phone) + '</div>' +
      '</div>' +

      '<div class="rmeta">' +
        '<div><div class="lbl">Ticket</div>' + esc(m.ticketId) + '</div>' +
        '<div><div class="lbl">Customer</div>' + esc(m.customer ? m.customer.name : 'Walk-in') +
          (m.customer ? '<br><span style="color:var(--muted)">' + esc(m.customer.phone) + '</span>' : '') + '</div>' +
        '<div><div class="lbl">Payment</div>' + esc(m.payment.label) + '</div>' +
        '<div><div class="lbl">Date</div><span id="receiptDate">' + esc(m.dateText) + '</span></div>' +
      '</div>' +

      lines +

      /* Tax-inclusive layout: the total comes FIRST and is the sum of the
         prices shown, then the tax breakdown sits underneath it, captioned so
         nobody reads the pre-tax and tax lines as further charges. */
      '<div class="rtot">' +
        '<div class="trow"><span>Subtotal</span><span>' + money(m.totals.sub) + '</span></div>' +
        '<div class="trow"><span>Warranty coverage</span><span>' + money(m.totals.warranty) + '</span></div>' +
        '<div class="trow grand"><span>Total</span><span>' + money(m.totals.total) + '</span></div>' +
        '<div class="taxbreak">' +
          '<div class="cap">Included in the total above — not added to it</div>' +
          '<div class="trow"><span>Pre-tax amount</span><span>' + money(m.totals.preTax) + '</span></div>' +
          '<div class="trow"><span>' + esc(m.totals.taxLabel) + '</span><span>' + money(m.totals.tax) + '</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="rfoot">' +
        esc(m.store.footer) + '<br>' +
        'PREVIEW ONLY — NOT A VALID RECEIPT · ' + esc(m.build.environment) +
        ' BUILD ' + esc(m.build.version) +
      '</div>' +

      testMarkHtml(m, 'bottom');
  }

  /* ---------------------------------------------------------------------- */
  /* 4b. ePOS-Print XML — BUILT AND TESTED, DELIBERATELY NOT CALLED          */
  /*                                                                        */
  /* This is a pure string builder over the receipt model above. It performs */
  /* NO network call of any kind — the file's no-fetch/no-XHR contract is    */
  /* intact — and it holds no printer address and no credential.            */
  /*                                                                        */
  /* Why it exists now: Route D (Package 11) prints through the Android      */
  /* system print service, which renders the page graphically. If that       */
  /* proves too slow or too coarse, the ESC/POS text path is the alternative */
  /* and it must consume the SAME model, not a second one. Writing it        */
  /* against the model while the model is being defined is what guarantees   */
  /* that. Nothing wires it up until a transport is approved.                */
  /* ---------------------------------------------------------------------- */
  var EPOS_COLS = 42;            /* font A, 80mm roll, 42 characters */

  function eposEsc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  function eposMoney(n) {
    if (typeof n !== 'number' || !isFinite(n)) { return 'UNAVAILABLE'; }
    return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
  }

  /* left text, right text, padded to EPOS_COLS. Truncates the LEFT side only
     — an amount is never allowed to be clipped. */
  function eposRow(left, right) {
    left = String(left == null ? '' : left);
    right = String(right == null ? '' : right);
    var room = EPOS_COLS - right.length - 1;
    if (room < 1) { return right.slice(0, EPOS_COLS) + '\n'; }
    if (left.length > room) { left = left.slice(0, room); }
    var gap = EPOS_COLS - left.length - right.length;
    return left + new Array(gap + 1).join(' ') + right + '\n';
  }

  function eposCenter(text) {
    text = String(text == null ? '' : text);
    if (text.length >= EPOS_COLS) { return text.slice(0, EPOS_COLS) + '\n'; }
    var padCount = Math.floor((EPOS_COLS - text.length) / 2);
    return new Array(padCount + 1).join(' ') + text + '\n';
  }

  function eposRule(ch) {
    return new Array(EPOS_COLS + 1).join(ch || '-') + '\n';
  }

  /* Wraps on word boundaries instead of chopping mid-word. A policy line that
     reads "...TEXT PLACEHOLDE" is a defect on a customer's paper slip, even
     when the text behind it is still a placeholder. */
  function eposWrap(text, centered) {
    var words = String(text == null ? '' : text).split(/\s+/).filter(Boolean);
    var out = '', line = '';
    function flush() {
      if (!line) { return; }
      out += centered ? eposCenter(line) : (line + '\n');
      line = '';
    }
    words.forEach(function (w) {
      while (w.length > EPOS_COLS) {            /* a single unbreakable token */
        flush();
        out += w.slice(0, EPOS_COLS) + '\n';
        w = w.slice(EPOS_COLS);
      }
      if (!line) { line = w; }
      else if (line.length + 1 + w.length <= EPOS_COLS) { line += ' ' + w; }
      else { flush(); line = w; }
    });
    flush();
    return out;
  }

  /* An ESC/POS font-A code page has no em dash, no curly quote and no middle
     dot. Transliterating 1:1 keeps the column arithmetic above exactly right
     while making sure nothing prints as a stray glyph. This runs ONCE, over
     the finished body, so there is still only one receipt model. */
  function eposAscii(s) {
    return String(s == null ? '' : s)
      .replace(/[\u2014\u2013\u2212]/g, '-')
      .replace(/[\u2018\u2019]/g, "'")
      .replace(/[\u201C\u201D]/g, '"')
      .replace(/\u00B7/g, '-')
      .replace(/\u00A0/g, ' ')
      .replace(/[^\x0A\x20-\x7E]/g, '?');
  }

  function buildEposPrintXml(model) {
    var m = model || buildReceiptModel();
    var body = '';

    if (m.isTest) {
      body += eposRule('*') + eposCenter(m.testMark) + eposWrap(m.testWhy, true) + eposRule('*');
    }

    body += eposCenter(m.store.short) + eposCenter(m.store.company);
    if (m.store.address) { body += eposCenter(m.store.address); }
    if (m.store.phone)   { body += eposCenter(m.store.phone); }
    body += eposRule('=');

    body += eposRow('Ticket', m.ticketId);
    body += eposRow('Date', m.dateText);
    body += eposRow('Customer', m.customer ? m.customer.name : 'Walk-in');
    body += eposRow('Payment', m.payment.label);
    body += eposRule('=');

    m.lines.forEach(function (l) {
      if (!l.resolved) {
        body += 'UNRESOLVED ITEM - not included in totals\n';
        body += '  ITEM ID: ' + l.itemId + '\n';
        return;
      }
      body += eposRow((l.brand + ' ' + l.model).trim(), eposMoney(l.lineTotal));
      body += '  ' + l.itemId + ' x' + l.qty + ' @ ' + eposMoney(l.unitPrice) + '\n';
      body += '  SERIAL: ' + l.serialPlaceholder + '\n';
      body += '  CONDITION: ' + (l.condition || '-') + '\n';
      body += '  ' + l.warrantyLabel + (l.warrantyPrice ? ' +' + eposMoney(l.warrantyPrice) : '') + '\n';
    });

    body += eposRule('-');
    body += eposRow('Subtotal', eposMoney(m.totals.sub));
    body += eposRow('Warranty coverage', eposMoney(m.totals.warranty));
    body += eposRow('TOTAL', eposMoney(m.totals.total));
    body += eposRule('-');
    body += eposWrap('Included in the total above - not added to it', true);
    body += eposRow('Pre-tax amount', eposMoney(m.totals.preTax));
    body += eposRow(m.totals.taxLabel, eposMoney(m.totals.tax));
    body += eposRule('=');

    if (m.store.footer) { body += eposWrap(m.store.footer, true); }
    body += eposCenter('PREVIEW ONLY - NOT A VALID RECEIPT');
    body += eposCenter(m.build.environment + ' BUILD ' + m.build.version);

    if (m.isTest) {
      body += eposRule('*') + eposCenter(m.testMark) + eposRule('*');
    }

    return '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">' +
             '<text lang="en"/>' +
             '<text smooth="true"/>' +
             '<text>' + eposEsc(eposAscii(body)) + '</text>' +
             '<feed unit="24"/>' +
             '<cut type="feed"/>' +
           '</epos-print>';
  }

  /* ---------------------------------------------------------------------- */
  /* 5. Activity timeline                                                    */
  /* ---------------------------------------------------------------------- */
  var KIND = {
    TRANSACTION_CREATED: { icon: 'i-register', tone: 'info' },
    CUSTOMER_LINKED:     { icon: 'i-link',     tone: 'info' },
    ITEM_ADDED:          { icon: 'i-plus',     tone: 'ok' },
    ITEM_REMOVED:        { icon: 'i-x',        tone: 'warn' },
    PRICE_CHANGED:       { icon: 'i-tag',      tone: 'warn' },
    WARRANTY_SELECTED:   { icon: 'i-shield',   tone: 'ok' },
    PAYMENT_RECORDED:    { icon: 'i-cash',     tone: 'ok' },
    PAYMENT_METHOD:      { icon: 'i-cash',     tone: 'info' },
    RECEIPT_EMAILED:     { icon: 'i-mail',     tone: 'info' },
    RECEIPT_PRINTED:     { icon: 'i-print',    tone: 'info' },
    INVENTORY_SOLD:      { icon: 'i-box',      tone: 'ok' },
    OFFLINE_QUEUED:      { icon: 'i-cloudoff', tone: 'warn' },
    SYNC_COMPLETED:      { icon: 'i-sync',     tone: 'ok' },
    PRINTER_STATUS:      { icon: 'i-print',    tone: 'danger' },
    SERVER_ERROR:        { icon: 'i-alert',    tone: 'danger' },
    CONNECTION_CHANGED:  { icon: 'i-cloudoff', tone: 'warn' }
  };

  function relTime(minutesAgo) {
    if (minutesAgo < 1) { return 'just now'; }
    if (minutesAgo < 60) { return minutesAgo + ' min ago'; }
    var h = Math.floor(minutesAgo / 60);
    return h + (h === 1 ? ' hr ago' : ' hrs ago');
  }

  function clockAt(minutesAgo) {
    var d = new Date(Date.now() - minutesAgo * 60000);
    return timeFmt ? timeFmt.format(d) : d.toLocaleTimeString();
  }

  function statusTone(s) {
    if (!s) { return ''; }
    if (['OK', 'SYNCED', 'SENT', 'APPROVED'].indexOf(s) !== -1) { return 's-ok'; }
    if (['QUEUED', 'ATTENTION', 'PENDING'].indexOf(s) !== -1) { return 's-warn'; }
    return 's-info';
  }

  function renderTimeline() {
    var el = $('#timeline');
    if (!el) { return; }

    // Newest first: ascending minutesAgo, tie-broken by insertion order
    // descending so same-minute local events stack newest-on-top.
    var events = state.activity.slice().sort(function (a, b) {
      if (a.minutesAgo !== b.minutesAgo) { return a.minutesAgo - b.minutesAgo; }
      return (b.seq || 0) - (a.seq || 0);
    });

    el.innerHTML = events.map(function (ev) {
      var k = KIND[ev.kind] || { icon: 'i-activity', tone: 'info' };

      var delta = '';
      if (ev.before != null || ev.after != null) {
        delta = '<div class="delta">' +
          (ev.before != null ? '<span class="b4">' + esc(ev.before) + '</span><span class="ar">→</span>' : '') +
          '<span class="af">' + esc(ev.after == null ? '—' : ev.after) + '</span>' +
        '</div>';
      }

      var tags = '';
      if (ev.status || ev.reason) {
        tags = '<div class="tags">' +
          (ev.status ? '<span class="tag ' + statusTone(ev.status) + '">' + esc(ev.status) + '</span>' : '') +
          (ev.reason ? '<span class="tag reason">Reason: ' + esc(ev.reason) + '</span>' : '') +
        '</div>';
      }

      return '<div class="tl k-' + k.tone + '">' +
        '<div class="spine"><span class="ico">' + icon(k.icon) + '</span></div>' +
        '<div class="content">' +
          '<div class="row1">' +
            '<span class="act">' + esc(ev.action) + '</span>' +
            '<span class="by">by <b>' + esc(ev.user) + '</b></span>' +
            '<span class="ts">' + esc(clockAt(ev.minutesAgo)) + ' · ' + esc(relTime(ev.minutesAgo)) + '</span>' +
          '</div>' +
          (ev.detail ? '<div class="detail">' + esc(ev.detail) + '</div>' : '') +
          delta + tags +
        '</div>' +
      '</div>';
    }).join('');
  }

  /** Appends a page-local event. Nothing is persisted or transmitted. */
  var localSeq = 0;
  function logLocalEvent(kind, action, opts) {
    opts = opts || {};
    localSeq += 1;
    state.activity.push({
      id: 'EV-LOCAL-' + localSeq,
      kind: kind, minutesAgo: 0, seq: localSeq,
      user: 'Taylor D. (this session)',
      action: action,
      detail: opts.detail, before: opts.before, after: opts.after,
      status: opts.status, reason: opts.reason
    });
    renderTimeline();
  }

  /* ---------------------------------------------------------------------- */
  /* 6. Offline / connection / printer status (simulation only)             */
  /* ---------------------------------------------------------------------- */
  function setChip(id, cls, text, busy) {
    var el = $(id);
    if (!el) { return; }
    el.className = 'chip ' + cls + (busy ? ' is-busy' : '');
    $('.t', el).textContent = text;
  }

  function renderStatus() {
    var c = state.conn;

    setChip('#chipNet',
      c.online ? 'is-ok' : 'is-danger',
      c.online ? 'ONLINE' : 'OFFLINE');

    setChip('#chipQueue',
      c.queue > 0 ? 'is-warn' : '',
      'LOCAL QUEUE: ' + c.queue);

    if (c.sync === 'SYNCING') {
      setChip('#chipSync', 'is-info', 'SYNCING…', true);
    } else if (c.sync === 'PENDING') {
      setChip('#chipSync', 'is-warn', 'SYNC PENDING');
    } else {
      setChip('#chipSync', 'is-ok', 'SYNCED');
    }

    setChip('#chipPrinter',
      c.printer === 'READY' ? 'is-ok' : 'is-danger',
      c.printer === 'READY' ? 'PRINTER READY' : 'PRINTER UNAVAILABLE');

    setChip('#chipEnv', 'is-warn', (CFG.environment || 'TEST') + ' · MOCK DATA');

    $('#simNet').textContent = c.online ? 'Go Offline' : 'Go Online';
  }

  function simulateOffline() {
    state.conn.online = false;
    state.conn.queue += 2;
    state.conn.sync = 'PENDING';
    renderStatus();
    logLocalEvent('OFFLINE_QUEUED', 'Offline queue engaged', {
      detail: state.conn.queue + ' pending writes held locally (simulated)',
      status: 'QUEUED', reason: 'Connection simulated offline'
    });
  }

  function simulateOnline() {
    state.conn.online = true;
    renderStatus();
    logLocalEvent('CONNECTION_CHANGED', 'Connection restored',
      { before: 'OFFLINE', after: 'ONLINE', status: 'OK' });
  }

  function simulateSync() {
    if (!state.conn.online) {
      logLocalEvent('SYNC_COMPLETED', 'Sync blocked',
        { detail: 'Device is offline — queue held', status: 'QUEUED', reason: 'No connection' });
      return;
    }
    var was = state.conn.queue;
    state.conn.sync = 'SYNCING';
    renderStatus();
    window.setTimeout(function () {
      state.conn.queue = 0;
      state.conn.sync = 'SYNCED';
      renderStatus();
      logLocalEvent('SYNC_COMPLETED', 'Sync completed',
        { before: was + ' queued', after: '0 queued', status: 'SYNCED' });
    }, 1400);
  }

  function simulatePrinter() {
    var before = state.conn.printer;
    state.conn.printer = before === 'READY' ? 'UNAVAILABLE' : 'READY';
    renderStatus();
    logLocalEvent('PRINTER_STATUS', 'Printer status changed', {
      before: before, after: state.conn.printer,
      status: state.conn.printer === 'READY' ? 'OK' : 'ATTENTION',
      reason: state.conn.printer === 'READY' ? 'Reconnected (simulated)' : 'Simulated paper out'
    });
  }

  /* ---------------------------------------------------------------------- */
  /* View switching + cart sheet                                             */
  /* ---------------------------------------------------------------------- */
  function setView(name) {
    state.view = name;
    $$('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + name); });
    $$('[data-view]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-view') === name); });
    var main = $('#main');
    if (main) { main.scrollTop = 0; }
  }

  function openCart(open) {
    $('#cartPanel').classList.toggle('open', open);
    $('#scrim').classList.toggle('show', open);
  }

  /* ---------------------------------------------------------------------- */
  /* Events                                                                  */
  /* ---------------------------------------------------------------------- */
  function wire() {
    // Navigation (rail + bottom bar)
    document.addEventListener('click', function (e) {
      var nav = e.target.closest ? e.target.closest('[data-view]') : null;
      if (nav) { setView(nav.getAttribute('data-view')); }
    });

    // Search
    $('#prodSearch').addEventListener('input', function (e) {
      state.search = e.target.value; renderGrid();
    });
    $('#prodSearchClear').addEventListener('click', function () {
      state.search = ''; $('#prodSearch').value = ''; renderGrid();
    });
    $('#custSearch').addEventListener('input', function (e) {
      state.custSearch = e.target.value; renderCustomerList();
    });
    $('#custSearchClear').addEventListener('click', function () {
      state.custSearch = ''; $('#custSearch').value = ''; renderCustomerList();
    });

    // Category filters
    $('#catFilters').addEventListener('click', function (e) {
      var b = e.target.closest('[data-cat]');
      if (!b) { return; }
      state.category = b.getAttribute('data-cat');
      renderCategories(); renderGrid();
    });

    // Product grid — add to sale
    $('#prodGrid').addEventListener('click', function (e) {
      var card = e.target.closest('.prod');
      if (!card) { return; }
      var btn = card.querySelector('[data-add]');
      if (!btn || btn.disabled) { return; }
      addToCart(btn.getAttribute('data-add'));
    });

    // Cart line actions
    $('#cartLines').addEventListener('click', function (e) {
      var rm = e.target.closest('[data-rm]');
      if (!rm) { return; }
      var idx = parseInt(rm.getAttribute('data-rm'), 10);
      var line = state.cart[idx];
      var it = line ? findItem(line.itemId) : null;
      state.cart.splice(idx, 1);
      if (it) {
        logLocalEvent('ITEM_REMOVED', 'Item removed from cart',
          { detail: it.itemId + ' — ' + it.brand + ' ' + it.model, status: 'OK' });
      }
      cartChanged();
      renderCart(); renderGrid(); renderReceipt();
    });

    $('#cartLines').addEventListener('change', function (e) {
      var sel = e.target.closest('[data-warr]');
      if (!sel) { return; }
      var idx = parseInt(sel.getAttribute('data-warr'), 10);
      var line = state.cart[idx];
      if (!line) { return; }
      var before = warrantyById(line.warrantyId);
      line.warrantyId = sel.value;
      var after = warrantyById(line.warrantyId);
      cartChanged();
      logLocalEvent('WARRANTY_SELECTED', 'Warranty selected', {
        before: before.label,
        after: after.label + (after.price ? ' (+' + money(after.price) + ')' : ''),
        detail: line.itemId, status: 'OK'
      });
      renderCart(); renderReceipt();
    });

    // Payment method
    $('#payGrid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-pay]');
      if (!b) { return; }
      var before = state.paymentMethodId;
      state.paymentMethodId = b.getAttribute('data-pay');
      renderPayments(); renderReceipt();
      logLocalEvent('PAYMENT_METHOD', 'Payment method changed',
        { before: before, after: state.paymentMethodId, status: 'OK' });
    });

    // Customer selection
    $('#custList').addEventListener('click', function (e) {
      var b = e.target.closest('[data-cust]');
      if (b) { linkCustomer(b.getAttribute('data-cust')); }
    });
    $('#cartCustChange').addEventListener('click', function () {
      setView('customer'); openCart(false);
    });

    // Cart sheet (phone)
    $('#cartFab').addEventListener('click', function () { openCart(true); });
    $('#cartClose').addEventListener('click', function () { openCart(false); });
    $('#scrim').addEventListener('click', function () { openCart(false); });

    // Status simulation
    $('#simNet').addEventListener('click', function () {
      state.conn.online ? simulateOffline() : simulateOnline();
    });
    $('#simSync').addEventListener('click', simulateSync);
    $('#simPrinter').addEventListener('click', simulatePrinter);

    /* Print — Package 11, Route D.
       This hands the already-rendered receipt to the BROWSER, which hands it
       to the operating system's print pipeline. On Android that is the system
       print service (e.g. Epson Print Enabler), and the print service is what
       talks to the receipt printer.

       This page therefore never contacts the printer: no fetch, no XHR, no
       printer address, no certificate to trust and no credential to hold.
       That is the whole point of the route — it is why an untrusted
       self-signed printer certificate and browser mixed-content rules cannot
       block it, and why there is nothing to roll back on the printer.

       The receipt view is made active and re-rendered FIRST: an inactive
       view is display:none, and a hidden receipt prints as a blank page. */
    $('#btnPrint').addEventListener('click', function () {
      setView('receipt');
      renderReceipt();

      var m = buildReceiptModel();
      var priced = m.lines.filter(function (l) { return l.resolved; }).length;
      var opened = false;
      try {
        if (typeof window.print === 'function') { window.print(); opened = true; }
      } catch (e) { opened = false; }

      logLocalEvent('RECEIPT_PRINTED',
        opened ? 'Receipt handed to the system print dialog'
               : 'System print dialog could not be opened', {
        detail: opened
          ? 'Choose the receipt printer in the print sheet. ' + priced + ' priced line(s)' +
            (m.totals.unresolvedCount
              ? ', ' + m.totals.unresolvedCount + ' unresolved line(s) shown but not priced'
              : '') + '.'
          : 'window.print() was unavailable in this frame. Use the browser menu ' +
            '(three dots) then Share, then Print.',
        status: opened ? 'HANDED_OFF' : 'BLOCKED',
        reason: m.isTest ? 'TEST build — the receipt is marked ' + m.testMark : null
      });
    });

    // Email Receipt and Reprint remain placeholders — intentionally inert.
    // They will consume buildReceiptModel() when their channels are approved.
    ['#btnEmail', '#btnReprint'].forEach(function (sel) {
      $(sel).addEventListener('click', function () {
        var label = sel === '#btnEmail' ? 'Email Receipt' : 'Reprint';
        logLocalEvent('RECEIPT_PRINTED', label + ' pressed (placeholder)', {
          detail: 'No mail sender and no reprint store exist in this build. Nothing was sent.',
          status: 'PENDING', reason: 'Not implemented in TEST shell pass 1'
        });
        setView('activity');
      });
    });

    // Read-only server round trip — proves the wiring without any writes.
    /* The one real server round trip in this build. It now runs through the
       same submit lock and the same error surface a sale will use, so both
       are exercised by real use rather than only by tests. */
    $('#btnReloadActivity').addEventListener('click', function () {
      var btn = this;
      withSubmitLock(btn, function (done) {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          done();
          return;
        }
        google.script.run
          .withSuccessHandler(function (fresh) {
            state.activity = (fresh && fresh.activity) || state.activity;
            renderTimeline();
            done();
          })
          .withFailureHandler(function (err) {
            logServerError('Reload activity failed', 'GETBOOTSTRAP_FAILED',
              err && err.message);
            done();
          })
          .getBootstrap();
      });
    });
  }

  /* ---------------------------------------------------------------------- */
  /* Boot                                                                    */
  /* ---------------------------------------------------------------------- */
  function applyOpenTicket() {
    var t = BOOT.openTicket;
    if (!t) { return; }
    state.ticketId = t.ticketId || state.ticketId;
    state.customerId = t.customerId || null;
    state.paymentMethodId = t.paymentMethodId || 'CASH';
    // Only lines that resolve against the ACTIVE inventory may enter the cart.
    // An unresolvable line is dropped and recorded — never silently carried in
    // as a blank, zero-priced phantom.
    var dropped = [];
    state.cart = (t.lines || []).reduce(function (acc, l) {
      var it = findItem(l.itemId);
      if (!it) { dropped.push(l.itemId); return acc; }
      acc.push({
        itemId: l.itemId,
        qty: l.qty || 1,
        unitPrice: l.priceOverride != null ? l.priceOverride : it.price,
        listPrice: it.price,
        warrantyId: l.warrantyId || 'W-30'
      });
      return acc;
    }, []);

    if (dropped.length) {
      logLocalEvent('TICKET_LINE_DROPPED', 'Open-ticket line not in active inventory', {
        detail: dropped.join(', ') + ' — dropped from the cart because ' +
          (dropped.length === 1 ? 'it does' : 'they do') + ' not exist in the ' +
          'active inventory source. Nothing was added to the sale.',
        status: 'BLOCKED',
        reason: 'Fail-closed: an unresolvable line never enters the cart'
      });
    }
    $('#ticketId').textContent = state.ticketId;
  }

  function init() {
    if (CFG.appName) { $('#brandName').textContent = CFG.appName; }
    if (CFG.companyName) { $('#brandCo').textContent = CFG.companyName; }
    $('#clockTz').textContent = 'CENTRAL · ' + (CFG.timezone || 'America/Chicago').toUpperCase();

    applyOpenTicket();

    renderCategories();
    renderGrid();
    renderCart();
    renderCartCustomer();
    renderPayments();
    renderCustomerList();
    renderCustomerDetail();
    renderReceipt();
    renderTimeline();
    renderStatus();
    loadDataSourceLabel();

    tickClock();
    window.setInterval(tickClock, 1000);

    wire();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
