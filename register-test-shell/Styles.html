<style>
/* ==========================================================================
   EDP OS Register — Styles.html
   TEST shell, pass 1. Self-contained: no external fonts, no CDN, no network.
   ========================================================================== */

/* --- Design tokens -------------------------------------------------------- */
:root {
  --brand-900: #0b1f33;
  --brand-800: #0f2740;
  --brand-700: #163d5e;
  --brand-600: #1d4e79;
  --accent-500: #f5a524;
  --accent-600: #d98a10;

  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --surface-sunken: #eef1f5;
  --ink: #0f151d;
  --ink-2: #3d4756;
  --muted: #6b7787;
  --line: #e1e6ec;
  --line-strong: #cbd3dd;

  --ok: #12805c;
  --ok-bg: #e6f5ef;
  --warn: #b45309;
  --warn-bg: #fdf3e3;
  --danger: #b42318;
  --danger-bg: #fdeceb;
  --info: #1d4e79;
  --info-bg: #e8f1f9;

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;

  --shadow-1: 0 1px 2px rgba(15, 33, 51, .06), 0 1px 3px rgba(15, 33, 51, .05);
  --shadow-2: 0 4px 12px rgba(15, 33, 51, .08), 0 1px 3px rgba(15, 33, 51, .06);
  --shadow-3: 0 12px 32px rgba(15, 33, 51, .16);

  --rail-w: 84px;
  --cart-w: 384px;
  --topbar-h: 60px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --tap: 46px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1116;
    --surface: #151b22;
    --surface-2: #1b222b;
    --surface-sunken: #0f151b;
    --ink: #e9eef4;
    --ink-2: #b8c2ce;
    --muted: #8996a6;
    --line: #263039;
    --line-strong: #35424e;

    --ok: #4ec99b;  --ok-bg: #10291f;
    --warn: #e0a458; --warn-bg: #2a1f10;
    --danger: #f08a80; --danger-bg: #2c1513;
    --info: #7fb2de; --info-bg: #10202e;

    --shadow-1: 0 1px 2px rgba(0,0,0,.5);
    --shadow-2: 0 4px 14px rgba(0,0,0,.5);
    --shadow-3: 0 14px 36px rgba(0,0,0,.6);
  }
}

/* --- Reset ---------------------------------------------------------------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
:focus-visible { outline: 3px solid var(--accent-500); outline-offset: 2px; border-radius: 6px; }

/* --- App frame ------------------------------------------------------------ */
.app {
  display: grid;
  grid-template-rows: auto auto 1fr;
  height: 100dvh;
  min-height: 100dvh;
}

/* --- TEST banner ---------------------------------------------------------- */
.testbar {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 6px 14px;
  background: repeating-linear-gradient(135deg, #2a1f10 0 12px, #33260f 12px 24px);
  color: var(--accent-500);
  font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  border-bottom: 1px solid #4a3712;
}
.testbar .dotpulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-500); animation: pulse 2s infinite; }
.testbar span.sub { color: #c8a76a; font-weight: 600; letter-spacing: .04em; text-transform: none; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* --- Top bar -------------------------------------------------------------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  min-height: var(--topbar-h);
  padding: 8px 16px;
  background: var(--brand-800);
  color: #eef4fa;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand .mark {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(150deg, var(--accent-500), var(--accent-600));
  display: grid; place-items: center;
  color: #23180a; font-weight: 800; font-size: 14px; letter-spacing: -.03em;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
}
.brand .names { line-height: 1.15; }
.brand .n1 { font-size: 14px; font-weight: 700; }
.brand .n2 { font-size: 11px; color: #9fb6cc; letter-spacing: .04em; }

/* Clock: time first, then full weekday/month/date/year */
.clock { margin-left: auto; text-align: right; line-height: 1.15; flex-shrink: 0; }
.clock .time {
  font-size: 20px; font-weight: 700; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
.clock .time .mer { font-size: 12px; font-weight: 600; color: #9fb6cc; margin-left: 3px; }
.clock .date { font-size: 11.5px; color: #9fb6cc; white-space: nowrap; }
.clock .tz { font-size: 10px; color: #7893ad; letter-spacing: .06em; }

/* --- Status strip --------------------------------------------------------- */
.statusstrip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.statusstrip::-webkit-scrollbar { display: none; }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 650; white-space: nowrap;
  border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--ink-2);
  flex-shrink: 0;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.chip.is-ok     { color: var(--ok);     background: var(--ok-bg);     border-color: transparent; }
.chip.is-warn   { color: var(--warn);   background: var(--warn-bg);   border-color: transparent; }
.chip.is-danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
.chip.is-info   { color: var(--info);   background: var(--info-bg);   border-color: transparent; }
.chip.is-busy .dot { animation: pulse 1.1s infinite; }
.chip.pressable { cursor: pointer; }
.chip.pressable:active { transform: scale(.96); }

.statusstrip .sim {
  margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0;
}
.statusstrip .sim .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }

/* --- Body layout ---------------------------------------------------------- */
.body {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--cart-w);
  min-height: 0;
}

/* --- Nav rail ------------------------------------------------------------- */
.rail {
  background: var(--brand-900);
  display: flex; flex-direction: column; align-items: stretch;
  padding: 10px 8px; gap: 6px;
  overflow-y: auto;
}
.rail button {
  display: grid; justify-items: center; gap: 5px;
  padding: 11px 4px; border-radius: 12px;
  color: #9fb6cc; font-size: 10.5px; font-weight: 650; letter-spacing: .02em;
  min-height: var(--tap);
  transition: background .12s, color .12s;
}
.rail button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.rail button:hover { color: #dbe7f2; background: rgba(255,255,255,.06); }
.rail button.active { color: #23180a; background: linear-gradient(150deg, var(--accent-500), var(--accent-600)); }
.rail .spacer { flex: 1; }
.rail .navitem { position: relative; }

/* --- Main ----------------------------------------------------------------- */
.main { min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }
.view { display: none; }
.view.active { display: block; }

.viewhead { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.viewhead h2 { font-size: 19px; }
.viewhead .sub { font-size: 12.5px; color: var(--muted); }
.viewhead .right { margin-left: auto; display: flex; gap: 8px; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-1);
}
.card + .card { margin-top: 14px; }
.card > header {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
}
.card > header h3 { font-size: 14px; }
.card > header .right { margin-left: auto; }
.card .pad { padding: 16px; }

/* --- Search + filters ----------------------------------------------------- */
.searchrow { display: flex; gap: 10px; margin-bottom: 12px; }
.search {
  flex: 1; position: relative; display: flex; align-items: center;
}
.search svg { position: absolute; left: 14px; width: 19px; height: 19px; stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none; }
.search input {
  width: 100%; height: 52px; padding: 0 44px 0 43px;
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); font-size: 16px;
}
.search input::placeholder { color: var(--muted); }
.search .clear {
  position: absolute; right: 8px; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; color: var(--muted); font-size: 18px;
}
.search .clear:hover { background: var(--surface-sunken); }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button {
  flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13.5px; font-weight: 600; color: var(--ink-2);
}
.filters button.active { background: var(--brand-800); border-color: var(--brand-800); color: #fff; }

/* --- Product grid --------------------------------------------------------- */
.grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
}
.prod {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
  display: flex; flex-direction: column; text-align: left;
  box-shadow: var(--shadow-1);
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.prod:hover { box-shadow: var(--shadow-2); border-color: var(--line-strong); }
.prod:active { transform: scale(.985); }
.prod[data-sellable="false"] { opacity: .62; }

.prod .photo {
  position: relative; aspect-ratio: 4 / 3; background: var(--surface-sunken);
  display: block; overflow: hidden;
}
.prod .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prod .photo .ph {
  position: absolute; left: 8px; bottom: 8px;
  background: rgba(11,31,51,.78); color: #dbe7f2;
  font-size: 9.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 5px;
}
.prod .photo .avail {
  position: absolute; right: 8px; top: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px; backdrop-filter: blur(3px);
}
.prod .info { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.prod .idline { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: .02em; }
.prod .cat { font-size: 10.5px; font-weight: 700; color: var(--info); text-transform: uppercase; letter-spacing: .06em; }
.prod .title { font-size: 14.5px; font-weight: 650; line-height: 1.25; }
.prod .desc { font-size: 12px; color: var(--muted); line-height: 1.3; }
.prod .foot { margin-top: auto; padding-top: 9px; display: flex; align-items: center; gap: 8px; }
.prod .price { font-size: 18px; font-weight: 750; letter-spacing: -.02em; }
.prod .cond { font-size: 10.5px; color: var(--muted); margin-left: auto; text-align: right; line-height: 1.2; }
.prod .add {
  height: 42px; margin: 0 12px 12px; border-radius: 10px;
  background: var(--brand-800); color: #fff; font-size: 13.5px; font-weight: 650;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.prod .add:disabled { background: var(--surface-sunken); color: var(--muted); cursor: not-allowed; }

.empty { padding: 46px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }

/* --- Cart panel ----------------------------------------------------------- */
.cart {
  background: var(--surface); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.cart > header {
  padding: 13px 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}
.cart > header h3 { font-size: 15px; }
.cart > header .tid { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.cart .closebtn { margin-left: auto; display: none; width: 38px; height: 38px; border-radius: 50%; place-items: center; color: var(--muted); font-size: 22px; }

.cart .who {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.cart .who .av {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: var(--info-bg); color: var(--info);
  display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
}
.cart .who .nm { font-size: 13.5px; font-weight: 650; line-height: 1.2; }
.cart .who .ph { font-size: 11.5px; color: var(--muted); }
.cart .who .chg { margin-left: auto; font-size: 12px; font-weight: 650; color: var(--info); }

.cart .lines { flex: 1; overflow-y: auto; min-height: 0; padding: 8px; }
.line { display: flex; gap: 11px; padding: 10px; border-radius: 11px; }
.line + .line { border-top: 1px solid var(--line); border-radius: 0; }
.line .thumb { width: 58px; height: 58px; border-radius: 9px; overflow: hidden; flex-shrink: 0; background: var(--surface-sunken); }
.line .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.line .mid { flex: 1; min-width: 0; }
.line .nm { font-size: 13.5px; font-weight: 650; line-height: 1.25; }
.line .meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.line .warr {
  margin-top: 6px; width: 100%; height: 34px; padding: 0 8px;
  border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  font-size: 12px;
}
.line .rt { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.line .amt { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.line .was { font-size: 11px; color: var(--muted); text-decoration: line-through; }
.line .rm { font-size: 11.5px; color: var(--danger); font-weight: 600; }

.cart .totals { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--surface-2); }
.trow { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); padding: 3px 0; }
.trow.grand { font-size: 20px; font-weight: 750; color: var(--ink); padding-top: 9px; margin-top: 6px; border-top: 1px solid var(--line-strong); letter-spacing: -.02em; }
.trow span:last-child { font-variant-numeric: tabular-nums; }

.pay { padding: 12px 16px; border-top: 1px solid var(--line); }
.pay .lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
.paygrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.paygrid button {
  height: 46px; border-radius: 10px; border: 1.5px solid var(--line-strong);
  background: var(--surface); font-size: 12.5px; font-weight: 650; color: var(--ink-2);
}
.paygrid button.active { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.paygrid button.active::after { content: " ✓"; }

.cart .checkout { padding: 12px 16px 16px; border-top: 1px solid var(--line); }
.btn-complete {
  width: 100%; height: 58px; border-radius: 13px;
  background: var(--ok); color: #fff; font-size: 16.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 9px;
}
.btn-complete:disabled {
  background: var(--surface-sunken); color: var(--muted);
  cursor: not-allowed; border: 1.5px dashed var(--line-strong);
}
.lockednote {
  margin-top: 9px; display: flex; gap: 8px; align-items: flex-start;
  font-size: 11.5px; line-height: 1.4; color: var(--warn);
  background: var(--warn-bg); border-radius: 9px; padding: 9px 11px;
}
.lockednote svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 2; }

/* --- Customer view -------------------------------------------------------- */
.custlist { display: grid; gap: 8px; }
.custrow {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); text-align: left;
  min-height: 66px;
}
.custrow:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
.custrow.active { border-color: var(--info); background: var(--info-bg); }
.custrow .av { width: 42px; height: 42px; border-radius: 50%; background: var(--info-bg); color: var(--info); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.custrow.active .av { background: var(--surface); }
.custrow .nm { font-size: 14.5px; font-weight: 650; }
.custrow .ph { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.custrow .rt { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--muted); }

.kv { display: grid; grid-template-columns: 132px 1fr; gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); font-size: 12.5px; }
.kv dd { margin: 0; font-weight: 550; }

.histrow { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
.histrow:first-child { border-top: 0; }
.histrow .d { font-family: var(--mono); font-size: 11.5px; color: var(--muted); width: 84px; flex-shrink: 0; }
.histrow .s { flex: 1; min-width: 0; }
.histrow .s .w { font-size: 11.5px; color: var(--muted); }
.histrow .t { font-weight: 700; font-variant-numeric: tabular-nums; }

.ph-block {
  border: 1.5px dashed var(--line-strong); border-radius: var(--radius);
  padding: 22px; text-align: center; color: var(--muted); font-size: 12.5px;
  background: var(--surface-2);
}
.ph-block .t { font-weight: 650; color: var(--ink-2); font-size: 13px; margin-bottom: 3px; }

/* --- Receipt -------------------------------------------------------------- */
.receiptwrap { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 16px; align-items: start; }
.receipt {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-2); padding: 26px; max-width: 620px; margin: 0 auto;
}
.receipt .rhead { text-align: center; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.receipt .rhead .mark {
  width: 50px; height: 50px; border-radius: 12px; margin: 0 auto 10px;
  background: linear-gradient(150deg, var(--accent-500), var(--accent-600));
  display: grid; place-items: center; color: #23180a; font-weight: 800; font-size: 17px;
}
.receipt .rhead h3 { font-size: 20px; letter-spacing: -.02em; }
.receipt .rhead .co { font-size: 12px; color: var(--muted); margin-top: 2px; }
.receipt .rhead .ph { font-size: 11.5px; color: var(--muted); font-family: var(--mono); margin-top: 6px; }

.receipt .rmeta { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; flex-wrap: wrap; }
.receipt .rmeta .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }

.ritem { display: flex; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.ritem .thumb { width: 82px; height: 82px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--surface-sunken); }
.ritem .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ritem .mid { flex: 1; min-width: 0; }
.ritem .nm { font-size: 14px; font-weight: 650; }
.ritem .sm { font-size: 11.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; line-height: 1.5; }
.ritem .warr { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 650; color: var(--ok); background: var(--ok-bg); padding: 3px 8px; border-radius: 5px; }
.ritem .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

.receipt .rtot { padding-top: 14px; }
.receipt .rfoot { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line-strong); text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.6; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: var(--tap); padding: 0 16px; border-radius: 11px;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13.5px; font-weight: 650; color: var(--ink-2);
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--brand-800); border-color: var(--brand-800); color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
