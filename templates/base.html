<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{% block title %}EDP Make Ready{% endblock %}</title>
<style>
:root {
  --bg: #0a0c14;
  --card: #1a2035;
  --border: #253048;
  --accent: #3b82f6;
  --ok: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --text: #f1f5f9;
  --sub: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 20px;
  line-height: 1.4;
  min-height: 100vh;
  overflow-x: hidden;
}
button, input, select, textarea, a, label { font-size: 20px; font-family: inherit; }
a { color: var(--accent); text-decoration: none; }
.container { padding: 16px; max-width: 900px; margin: 0 auto; }
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--card);
  border-bottom: 2px solid var(--border);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.topbar .ttl { font-size: 22px; font-weight: 700; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .who { font-size: 18px; color: var(--sub); }
.topbar a.back { color: var(--text); font-size: 20px; padding: 8px 12px;
  border-radius: 8px; background: rgba(255,255,255,.06); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: #fff; border: none;
  font-size: 20px; font-weight: 700;
  padding: 18px 24px; border-radius: 14px;
  min-height: 56px; cursor: pointer; text-decoration: none;
  width: 100%;
}
.btn.green { background: var(--ok); }
.btn.warn { background: var(--warn); color: #000; }
.btn.red { background: var(--danger); }
.btn.grey { background: var(--border); color: var(--sub); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { margin-bottom: 16px; }
label.lbl { display: block; font-size: 18px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
input[type=text], input[type=tel], input[type=number], input[type=email],
input[type=password], select, textarea {
  width: 100%;
  background: rgba(255,255,255,.06);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 20px;
  min-height: 56px;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--card); color: var(--ok);
  border: 2px solid var(--ok);
  padding: 14px 24px; border-radius: 12px;
  font-size: 20px; font-weight: 700; z-index: 9999;
}
.error { color: var(--danger); font-size: 20px; text-align: center; min-height: 30px; }
.card {
  background: var(--card); border: 2px solid var(--border);
  border-radius: 16px; padding: 18px; margin-bottom: 14px;
}
.spill {
  font-size: 16px; font-weight: 700; padding: 5px 12px;
  border-radius: 8px; background: var(--border); color: var(--text);
  display: inline-block;
}
.spill.fr { background: rgba(34,197,94,.2); color: var(--ok); }
.spill.wp { background: rgba(245,158,11,.2); color: var(--warn); }
.spill.sv { background: rgba(59,130,246,.2); color: var(--accent); }
.spill.dh { background: rgba(245,158,11,.2); color: var(--warn); }
.spill.dh.red { background: rgba(239,68,68,.2); color: var(--danger); }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
